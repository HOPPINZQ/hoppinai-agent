server:
  port: 8099
logging:
  level:
    com:
      hoppinzq: info
spring:
  profiles:
    active: dev
  mvc:
    static-path-pattern: /static/**       #静态资源路径
    view:
      prefix: /view               #页面资源路径
  servlet:
    multipart:
      max-request-size: 1000MB               # 最大请求大小
      max-file-size: 1000MB
  ################ mysql配置 ########################
  datasource:
    url: xxxxxxxxxx
    username: xxxxxxxx
    password: xxxxxxxx
    db-name: xxxxxxxx
    driverClassName: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 120000

  #bean可以重复
  main:
    allow-bean-definition-overriding: true

################ mybatis配置 #######################

# mybatis-plus相关配置
mybatis-plus:
  # xml扫描，多个目录用逗号或者分号分隔（告诉 Mapper 所对应的 XML 文件位置）
  mapper-locations: classpath:**/*Mapper.xml
  type-aliases-package: com.hoppinzq.bean
  # 以下配置均有默认值,可以不设置
  global-config:
    #主键类型  0:"数据库ID自增", 1:"用户输入ID",2:"全局唯一ID (数字类型唯一ID)", 3:"全局唯一ID UUID";
    id-type: 1
    #字段策略 0:"忽略判断",1:"非 NULL 判断"),2:"非空判断"
    field-strategy: 2
    #驼峰下划线转换
    db-column-underline: false
    #刷新mapper 调试神器
    refresh-mapper: true
    #数据库大写下划线转换
    #capital-mode: true
    #序列接口实现类配置
    #key-generator: com.baomidou.springboot.xxx
    #逻辑删除配置
    #logic-delete-value: 0 # 逻辑已删除值(默认为 1)
    #logic-not-delete-value: 1 # 逻辑未删除值(默认为 0)
    #自定义填充策略接口实现
    #    meta-object-handler: com.zhengqing.config.MyMetaObjectHandler
    #自定义SQL注入器
    #sql-injector: com.baomidou.springboot.xxx
  configuration:
    # 是否开启自动驼峰命名规则映射:从数据库列名到Java属性驼峰命名的类似映射
    map-underscore-to-camel-case: true
    cache-enabled: true
    # 如果查询结果中包含空值的列，则 MyBatis 在映射的时候，不会映射这个字段
    #    call-setters-on-nulls: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 解决oracle更新数据为null时无法转换报错，mysql不会出现此情况
    jdbc-type-for-null: 'null'
    default-statement-timeout: 60 # 设置默认的 SQL 执行超时时间，单位为秒

################ 网易云私信 AI 机器人 #######################
wyy:
  im:
    # 是否开启私信自动回复
    enabled: ${WYY_IM_ENABLED:true}
    # NeteaseCloudMusicApi 服务地址
    base-url: ${WYY_API_BASE_URL:https://hoppinzq.com:3003/}
    # 网易云登录 Cookie（必填，建议用环境变量注入，不要提交到仓库）
    cookie: ${WYY_COOKIE:}
    # 轮询间隔 / 首次延迟（毫秒）
    poll-interval-ms: 60000
    initial-delay-ms: 15000
    # 单次最多处理多少会话、每个会话最多拉取多少条历史消息
    max-conversations: 20
    max-history: 20
    # 只处理最近 N 分钟内的消息，<=0 表示不限制
    max-age-minutes: 180
    # 演练模式：调用 AI 并打印计划，但不真正发送私信
    dry-run: false
    # 是否允许 AI 推荐歌曲
    send-song: true
    max-reply-length: 300
    request-timeout-seconds: 20
    # 跳过的机器人账号 / 昵称关键词
    bot-user-ids:
      - 9003
    bot-nickname-keywords:
      - 小秘书
      - 机器人
      - 客服
      - 官方
      - 助手
      - bot
    # 自定义 AI 人设；留空使用内置默认提示词
    system-prompt: ""

